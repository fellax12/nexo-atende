name: Build Nexo APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 35
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extrair Nexo Atende
        run: |
          unzip -q Nexo-Atende-0.1.3-reconstruido.zip
          test -f Nexo-Atende-0.1.3-reconstruido/app/build.gradle
          test -f Nexo-Atende-0.1.3-reconstruido/settings.gradle

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: Nexo-Atende-0.1.3-reconstruido
        run: gradle --no-daemon :app:assembleDebug

      - name: Preparar APK
        run: |
          cp Nexo-Atende-0.1.3-reconstruido/app/build/outputs/apk/debug/app-debug.apk Nexo-Atende-0.1.3.apk
          test -f Nexo-Atende-0.1.3.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexo-Atende-0.1.3-APK
          path: Nexo-Atende-0.1.3.apk
          if-no-files-found: error
          retention-days: 7
