name: Build Nexo APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extrair projeto Nexo Atende 0.4.0
        run: |
          rm -rf Nexo-Atende-0.4.0
          unzip -q Nexo-Atende-0.4.0.zip
          test -f Nexo-Atende-0.4.0/settings.gradle
          test -f Nexo-Atende-0.4.0/app/build.gradle
          echo "Projeto Nexo Atende 0.4.0 encontrado."

      - name: Corrigir codigo Java
        working-directory: Nexo-Atende-0.4.0
        run: |
          FILE="app/src/main/java/br/com/nexo/atende/MainActivity.java"

          if ! grep -q "import android.widget.Toast;" "$FILE"; then
            sed -i '/^package br.com.nexo.atende;/a import android.widget.Toast;' "$FILE"
          fi

          echo "Verificando import do Toast:"
          grep "import android.widget.Toast;" "$FILE"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar Nexo Atende 0.4.0
        working-directory: Nexo-Atende-0.4.0
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Verificar APK
        run: |
          test -f Nexo-Atende-0.4.0/app/build/outputs/apk/debug/app-debug.apk
          echo "APK Nexo Atende 0.4.0 compilado com sucesso."

      - name: Preparar APK final
        run: |
          cp Nexo-Atende-0.4.0/app/build/outputs/apk/debug/app-debug.apk Nexo-Atende-0.4.0.apk
          ls -lh Nexo-Atende-0.4.0.apk

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexo-Atende-0.4.0-APK
          path: Nexo-Atende-0.4.0.apk
          if-no-files-found: error
          retention-days: 7
